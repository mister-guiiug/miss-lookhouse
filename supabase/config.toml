project_id = "miss-lookhouse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.listing-media]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
# Remplacer par l'URL du site déployé (GitHub Pages) en production.
site_url = "http://127.0.0.1:5214"
additional_redirect_urls = ["https://mister-guiiug.github.io/miss-lookhouse/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

# SMTP personnalisé — supabase/README.md §4.2. Le service intégré n'écrit qu'aux
# membres de l'équipe du projet, 2 messages par heure. En production, il se
# règle au tableau de bord (Authentication › Emails › SMTP Settings) ; ce bloc
# ne vaut que pour la pile locale. Valeurs lues dans l'environnement, jamais
# écrites ici.
# [auth.email.smtp]
# enabled = true
# host = "smtp.votre-fournisseur.example"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASS)"
# admin_email = "no-reply@votre-domaine.example"
# sender_name = "Miss LookHouse"

# Politique d'inscription (migration 0018) — supabase/README.md §4.1. INACTIVE
# tant que ce bloc reste commenté (en local) et que le hook n'est pas branché
# au tableau de bord (Authentication › Hooks, en production).
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/public/lh_before_user_created"

# MFA TOTP (Pro plan) — recommandé pour durcir l'accès.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2
