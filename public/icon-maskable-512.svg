<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Miss LookHouse">
  <!--
    LE MASKABLE, ET POURQUOI CE N'EST PAS `favicon.svg` EN PLUS PETIT.

    Le PNG maskable livré jusqu'à septembre 2026 était la tuile arrondie RÉDUITE
    sur un fond vert pâle : le raccord se voyait, et Android en faisait un liseré
    clair tout autour de l'icône. Un maskable ne se fabrique pas en
    redimensionnant une tuile — il se dessine à fond perdu.

    UNE SEULE DIFFÉRENCE AVEC LA SOURCE, DÉSORMAIS : LE FOND N'A PLUS DE COINS.
    `rx="112"` devient un rectangle plein. Quel que soit le masque de l'appareil
    — cercle, squircle, goutte — il n'y a pas de bord à voir, puisqu'il n'y en a
    plus. Le dégradé, ses arrêts et le dessin sont identiques, au pixel.

    CE QUI A DISPARU : LA RUSTINE. L'icône précédente devait être recentrée à la
    main (`translate(-13.5 -12)`) puis ramenée à 88 %, parce que le manche de la
    loupe la poussait hors de la zone de sécurité — le disque de 80 % de la
    toile, rayon 204,8. Ce dessin-ci est centré nativement et y tient : son point
    le plus éloigné du centre est le coin bas-gauche de la première barre, à
    188 px. Dix-sept pixels de marge, sans rien mettre à l'échelle.

    Donc : si `favicon.svg` change, ce fichier se met à jour en recopiant son
    dessin tel quel. Il n'y a plus de transformation à refaire.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)" />
  <!-- Toit : il déborde de 5 px de chaque côté de la série, comme un avant-toit -->
  <path
    d="M137 226 256 128 375 226"
    fill="none"
    stroke="#ecfeff"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- La série : trois relevés, en baisse -->
  <g fill="#ecfeff">
    <rect x="142" y="253" width="65" height="152" rx="16" />
    <rect x="223" y="253" width="65" height="116" rx="16" />
    <rect x="304" y="253" width="65" height="80" rx="16" />
  </g>
</svg>
