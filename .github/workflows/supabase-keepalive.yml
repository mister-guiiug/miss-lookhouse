# Anti-pause Supabase Free — caller planifié.
#
# Un projet Free se met en pause après sept jours sans requête, et le
# déploiement échoue alors sur « project is paused » (miss-carbook, 29/08/2026).
# Ce ping fait un SELECT anonyme tous les trois jours.
#
# Requiert les variables VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY, et une
# table que `anon` peut lire.
name: Supabase keep-alive

on:
  schedule:
    - cron: '31 4 */3 * *' # ~tous les 3 jours (< 7 j) — décalé par dépôt
  workflow_dispatch:

jobs:
  keepalive:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-keepalive.yml@v4
    # Aucun `with:` : la cible est `keep_alive`, le défaut du réutilisable.
    #
    # Ce bloc a porté `table: profiles` du 13 au 14/09/2026, le temps que ce
    # projet redevienne migrable — `keep_alive` n'existait pas en base, et les
    # neuf exécutions de `Supabase migrations` depuis juin échouaient faute de
    # secrets. Le ping était alors VERT sur une table métier, ce qui protégeait
    # bien de la pause mais ne disait plus rien de l'état du keep-alive.
    # Le dépôt a reçu ses secrets le 14/09, `0011_keep_alive` et
    # `0014_keep_alive_privileges` sont passées, et le repli a été effacé —
    # comme son propre commentaire le prescrivait.
    #
    # Nommés, pas hérités : le workflow déclare exactement ces deux secrets.
    # `inherit` lui donnerait accès à tout le trousseau du dépôt.
    secrets:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
