# Tests pgTAP du schéma (RLS, SECURITY DEFINER) sur une pile Supabase jetable.
#
# POURQUOI CE WORKFLOW EXISTE. Le poste de développement n'a pas de démon
# Docker qui démarre : `supabase start` y est impossible, et les choix de
# sécurité de 0002 n'avaient donc JAMAIS été exécutés — seulement relus. La CI
# est le seul endroit où ces tests tournent pour de vrai.
#
# CE FICHIER A ÉTÉ LE PREMIER DU PARC, et c'est de lui qu'a été tiré le
# réutilisable `pwa-supabase-test.yml` du socle (05/09/2026). Il lui délègue
# désormais, au lieu de porter sa propre copie des mêmes étapes. Ce que le
# dépôt gagne à l'échange :
#
#   • une GARDE explicite — le job dit en clair qu'il manque `config.toml` ou
#     un fichier dans `supabase/tests/`, au lieu d'échouer sur un message du
#     CLI ou, pire, de passer au vert sans avoir rien joué ;
#   • `persist-credentials: false` au checkout — le jeton d'Actions ne reste
#     pas dans `.git/config` d'un job qui exécute du SQL de migration ;
#   • le nom du conteneur de base RETROUVÉ au lieu d'être écrit à la main :
#     `supabase_db_miss-lookhouse` était codé en dur dans l'étape de
#     diagnostic, qui échouait donc elle-même le jour où le CLI change sa
#     convention de nommage — précisément le jour où l'on a besoin d'elle ;
#   • les corrections à venir, écrites une fois pour tous les dépôts qui
#     l'appellent, au lieu d'être recopiées dans chacun.
#
# Aucun secret : tout se passe dans une base jetable du runner. Rien ne touche
# le projet hébergé (voir `supabase-migrations.yml` pour ça).
name: Supabase tests

on:
  pull_request:
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-supabase-test.yml@v4
