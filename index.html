<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Anti-FOUC : applique le thème avant tout rendu.

      Doit lire les MÊMES clés que `ThemeProvider` (`react/theme-provider`), et
      dans le même ordre : la clé famille d'abord, l'ancienne `lh_theme` en
      repli tant que la migration n'a pas eu lieu sur cet appareil. Sinon le
      premier écran s'affiche dans le mauvais thème, puis bascule.

      `system` est désormais une valeur stockable : elle se résout ici comme
      l'absence de valeur, sur la préférence du système d'exploitation.
    -->
    <script>
      (function () {
        try {
          var v =
            localStorage.getItem('dwc_theme') ||
            localStorage.getItem('lh_theme');
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta id="meta-theme-color" name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miss LookHouse" />
    <!--
      UN PNG, PAS LE SVG. iOS ne sait pas lire un SVG pour `apple-touch-icon` :
      il ignorait la balise et posait une CAPTURE DE LA PAGE sur l'écran
      d'accueil. Le 180 est la taille que réclament les iPhone récents.

      Il est rendu depuis `icon-maskable-512.svg` — la source À FOND PERDU — et
      non depuis `favicon.svg`. iOS pose son propre masque et n'accepte pas la
      transparence : partir de la tuile arrondie fait aplatir ses coins sur une
      couleur, et le fichier livré jusqu'au 14/09/2026 les portait en
      `12,18,34`, le bleu-noir par défaut de `pwa-icons`. Voir
      `scripts/generate-maskable.mjs`, qui l'écrit avec le maskable.
    -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="description"
      content="Veille immobilière responsable : surveillez vos zones, historisez les annonces, repérez doublons et baisses de prix."
    />
    <title>Miss LookHouse</title>
    <!-- SEO/partage : __SEO_HOME_URL__ et __SEO_LOGO_URL__ sont remplis au
         build par pwaSeoPlugin() (vite.config.ts). -->
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Miss LookHouse" />
    <meta
      property="og:description"
      content="Veille immobilière responsable : surveillez vos zones, historisez les annonces, repérez doublons et baisses de prix."
    />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
